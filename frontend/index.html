<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Estudiantes</title>
    <link rel="stylesheet" href="styles_modern.css" />
  </head>
  <body>
    <h1>Lista de Estudiantes</h1>
    <div class="alta-container">
      <input type="text" id="studentNameInput" placeholder="Nombre del nuevo estudiante">
      <button id="addStudentBtn">Agregar Estudiante</button>
    </div>
    <button id="loadButton">Cargar Estudiantes</button>
    <div class="saludo-container">
      <input type="text" id="nameInput" placeholder="Ingresá tu nombre">
      <button id="greetBtn">Saludarme</button>
      <p id="greetingMessage"></p>
    </div>
    <table id="studentsTable">
      <thead>
        <tr>
          <th>Id</th>
          <th>Nombre</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script src="script.js"></script>
  </body>
</html>
